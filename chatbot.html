<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot UI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: #f8fafc;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .welcome-container {
      text-align: center;
      max-width: 600px;
      padding: 2rem;
    }

    .welcome-title {
      font-size: 2rem;
      color: #1f2937;
      margin-bottom: 2rem;
    }

    .input-container {
      position: relative;
      width: 100%;
    }

    .input-field {
      width: 100%;
      padding: 1rem 4rem 1rem 1.5rem;
      font-size: 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 25px;
      outline: none;
      background: white;
    }

    .input-field:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .send-button {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      padding: 0.6rem 1.2rem;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
    }

    .send-button:hover {
      background: #2563eb;
    }

    /* Chat mode styles */
    .chat-mode {
      height: 100vh;
      display: flex !important;
      align-items: stretch !important;
      justify-content: stretch !important;
    }

    .sidebar {
      width: 280px;
      background: linear-gradient(180deg, #1e293b 0%, #334155 100%);
      color: white;
      padding: 1.5rem;
      display: none;
    }

    .chat-mode .sidebar {
      display: block;
    }

    .main-chat {
      flex: 1;
      display: none;
      flex-direction: column;
      background: white;
    }

    .chat-mode .main-chat {
      display: flex;
    }

    .chat-mode .welcome-container {
      display: none;
    }

    .chatbox {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
    }

    .chat-input-area {
      padding: 1.5rem;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 1rem;
    }

    .chat-input {
      flex: 1;
      padding: 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 25px;
      outline: none;
    }

    .chat-input:focus {
      border-color: #3b82f6;
    }

    .chat-send-button {
      padding: 1rem 1.5rem;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
    }

    .message {
      margin-bottom: 1rem;
      padding: 1rem;
      border-radius: 10px;
      max-width: 70%;
    }

    .message.user {
      background: #3b82f6;
      color: white;
      margin-left: auto;
    }

    .message.bot {
      background: #f1f5f9;
      color: #1f2937;
    }

    .history-item {
      padding: 0.5rem;
      margin-bottom: 0.5rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div id="app-container">
    <!-- Welcome Screen -->
    <div class="welcome-container" id="welcome-container">
      <h1 class="welcome-title">What can I help with today?</h1>
      <form id="welcome-form">
        <div class="input-container">
          <input 
            type="text" 
            id="welcome-input" 
            class="input-field"
            placeholder="Message ChatBot..." 
            autocomplete="off"
          />
          <button type="submit" class="send-button">Send</button>
        </div>
      </form>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <h2>Chat History</h2>
      <div id="history"></div>
    </div>

    <!-- Main Chat Area -->
    <div class="main-chat" id="main-chat">
      <div id="chatbox" class="chatbox"></div>
      <form id="chat-form" class="chat-input-area">
        <input 
          type="text" 
          id="chat-input" 
          class="chat-input"
          placeholder="Type your message..." 
          autocomplete="off"
        />
        <button type="submit" class="chat-send-button">Send</button>
      </form>
    </div>
  </div>

  <script>
    const appContainer = document.getElementById('app-container');
    const welcomeForm = document.getElementById('welcome-form');
    const chatForm = document.getElementById('chat-form');
    const welcomeInput = document.getElementById('welcome-input');
    const chatInput = document.getElementById('chat-input');
    const chatbox = document.getElementById('chatbox');
    const historyEl = document.getElementById('history');

    let isChatMode = false;

    // Welcome form handler
    welcomeForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const message = welcomeInput.value.trim();
      if (!message) return;

      // Switch to chat mode
      isChatMode = true;
      appContainer.classList.add('chat-mode');
      
      // Add the message to chat
      addMessage('user', message);
      addMessage('bot', 'Hello! I received your message: "' + message + '"');
      
      // Save to history
      saveToHistory(message);
      
      // Focus chat input
      setTimeout(() => chatInput.focus(), 100);
    });

    // Chat form handler
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const message = chatInput.value.trim();
      if (!message) return;

      addMessage('user', message);
      addMessage('bot', 'I received: "' + message + '"');
      saveToHistory(message);
      chatInput.value = '';
    });

    function addMessage(sender, text) {
      const message = document.createElement('div');
      message.className = `message ${sender}`;
      message.textContent = text;
      chatbox.appendChild(message);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    function saveToHistory(text) {
      const item = document.createElement('div');
      item.className = 'history-item';
      item.textContent = text.length > 30 ? text.substring(0, 30) + '...' : text;
      item.onclick = () => {
        if (isChatMode) {
          chatInput.value = text;
          chatInput.focus();
        } else {
          welcomeInput.value = text;
          welcomeInput.focus();
        }
      };
      historyEl.appendChild(item);
    }

    // Focus welcome input on load
    setTimeout(() => welcomeInput.focus(), 100);
  </script>
</body>
</html>
