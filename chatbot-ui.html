<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot UI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    :root {
      --sidebar-width: 280px;
      --sidebar-collapsed: 70px;
      --primary-color: #3b82f6;
      --primary-dark: #2563eb;
      --primary-light: #dbeafe;
      --secondary-color: #6366f1;
      --success-color: #10b981;
      --warning-color: #f59e0b;
      --danger-color: #ef4444;
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --bg-tertiary: #f1f5f9;
      --sidebar-bg: linear-gradient(180deg, #1e293b 0%, #334155 100%);
      --text-primary: #1f2937;
      --text-secondary: #6b7280;
      --text-light: #9ca3af;
      --border-color: #e5e7eb;
      --border-light: #f3f4f6;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      --transition-fast: 0.15s ease;
      --transition-normal: 0.3s ease;
      --transition-slow: 0.5s ease;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-secondary);
      display: flex;
      height: 100vh;
      overflow: hidden;
      color: var(--text-primary);
      line-height: 1.6;
    }

    /* Sidebar Styles */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      color: white;
      padding: 1.5rem;
      transition: all var(--transition-normal);
      overflow-x: hidden;
      position: relative;
      flex-shrink: 0;
      box-shadow: var(--shadow-lg);
      z-index: 100;
    }

    .sidebar.collapsed {
      width: var(--sidebar-collapsed);
      padding: 1rem 0.5rem;
    }

    .sidebar.collapsed h2,
    .sidebar.collapsed .history-item,
    .sidebar.collapsed .sidebar-actions,
    .sidebar.collapsed .vote-stats {
      opacity: 0;
      transform: translateX(-20px);
      pointer-events: none;
    }

    .sidebar.collapsed .toggle-btn {
      left: 50%;
      transform: translateX(-50%);
    }

    .toggle-btn {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      position: absolute;
      top: 15px;
      left: 15px;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      backdrop-filter: blur(10px);
    }

    .toggle-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    .sidebar h2 {
      margin: 0;
      margin-top: 3rem;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      opacity: 0.9;
      transition: all var(--transition-normal);
    }

    .history {
      font-size: 0.9rem;
      overflow-y: auto;
      max-height: calc(100vh - 140px);
      padding-right: 8px;
    }

    .history::-webkit-scrollbar {
      width: 4px;
    }

    .history::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    .history::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
    }

    .history-item {
      padding: 0.75rem 0.5rem;
      margin-bottom: 0.5rem;
      border-radius: 8px;
      word-break: break-word;
      cursor: pointer;
      transition: all var(--transition-fast);
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid transparent;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.1);
      border-left-color: var(--primary-color);
      transform: translateX(4px);
    }

    .vote-stats {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 1rem;
      font-size: 0.8rem;
      transition: all var(--transition-normal);
    }

    .vote-stats .stats-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.25rem;
    }

    .vote-stats .stats-row:last-child {
      margin-bottom: 0;
    }

    .sidebar-actions {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: all var(--transition-normal);
    }

    .export-button {
      padding: 0.5rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #a7f3d0;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .export-button:hover {
      background: rgba(16, 185, 129, 0.2);
      transform: translateY(-1px);
    }

    .clear-history {
      padding: 0.5rem;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fecaca;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .clear-history:hover {
      background: rgba(239, 68, 68, 0.2);
      transform: translateY(-1px);
    }

    /* Main Content */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
      position: relative;
    }

    .chatbox {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
      background: linear-gradient(135deg, #f8fafc 0%, #ffffff 100%);
      position: relative;
    }

    .chatbox::-webkit-scrollbar {
      width: 6px;
    }

    .chatbox::-webkit-scrollbar-track {
      background: var(--bg-tertiary);
      border-radius: 3px;
    }

    .chatbox::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .chatbox::-webkit-scrollbar-thumb:hover {
      background: var(--text-light);
    }

    /* Message Styles */
    .message {
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      align-items: flex-end;
    }

    .bubble {
      background: var(--bg-primary);
      padding: 1.25rem 1.5rem;
      border-radius: 20px;
      max-width: 75%;
      line-height: 1.6;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-light);
      position: relative;
      word-wrap: break-word;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      color: white;
      border: none;
      box-shadow: var(--shadow-lg);
    }

    .message.bot .bubble {
      background: var(--bg-primary);
      border-left: 4px solid var(--primary-color);
    }

    .bubble::before {
      content: '';
      position: absolute;
      width: 0;
      height: 0;
    }

    .message.user .bubble::before {
      bottom: 8px;
      right: -8px;
      border: 8px solid transparent;
      border-left-color: var(--primary-color);
    }

    .message.bot .bubble::before {
      bottom: 8px;
      left: -8px;
      border: 8px solid transparent;
      border-right-color: var(--bg-primary);
    }

    .timestamp {
      font-size: 0.75rem;
      color: var(--text-light);
      margin-top: 0.5rem;
      opacity: 0.7;
    }

    /* Typing Indicator */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-secondary);
      font-style: italic;
    }

    .typing-dots {
      display: flex;
      gap: 4px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--primary-color);
      border-radius: 50%;
      animation: typingBounce 1.4s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typingBounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }
      30% {
        transform: translateY(-10px);
      }
    }

    /* Table Styles */
    table {
      border-collapse: collapse;
      margin-top: 1rem;
      font-size: 0.9rem;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      width: 100%;
      background: var(--bg-primary);
    }

    table th {
      background: var(--primary-light);
      color: var(--primary-dark);
      font-weight: 600;
      padding: 1rem;
      text-align: left;
    }

    table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-light);
    }

    table tr:nth-child(even) {
      background: var(--bg-tertiary);
    }

    table tr:hover {
      background: var(--primary-light);
      transition: background var(--transition-fast);
    }

    /* Input Area */
    .input-area {
      display: flex;
      padding: 1.5rem 2rem;
      border-top: 1px solid var(--border-color);
      background: var(--bg-primary);
      box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.05);
      gap: 1rem;
      align-items: flex-end;
    }

    .input-container {
      flex: 1;
      position: relative;
    }

    input[type="text"] {
      width: 100%;
      padding: 1rem 1.25rem;
      font-size: 1rem;
      border-radius: 25px;
      border: 2px solid var(--border-color);
      outline: none;
      box-shadow: var(--shadow-sm);
      transition: all var(--transition-fast);
      background: var(--bg-secondary);
      font-family: inherit;
    }

    input[type="text"]:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      background: var(--bg-primary);
    }

    .send-button {
      padding: 1rem 1.5rem;
      border: none;
      border-radius: 25px;
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      color: white;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all var(--transition-fast);
      box-shadow: var(--shadow-md);
      min-width: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .send-button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .send-button:active {
      transform: translateY(0);
    }

    .send-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Vote Buttons */
    .vote-container {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      align-items: center;
    }

    .vote {
      background: var(--bg-secondary);
      font-size: 1.1rem;
      padding: 0.5rem;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      transition: all var(--transition-fast);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vote:hover:not(:disabled) {
      background: var(--primary-light);
      border-color: var(--primary-color);
      transform: scale(1.1);
    }

    .vote.selected {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    .vote:disabled {
      opacity: 0.4;
      cursor: default;
      transform: none;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        height: 100vh;
        z-index: 1000;
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar.collapsed {
        transform: translateX(-100%);
      }

      .main {
        margin-left: 0;
      }

      .toggle-btn {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 1001;
        background: var(--primary-color);
      }

      .chatbox {
        padding: 1rem;
      }

      .input-area {
        padding: 1rem;
        flex-direction: column;
        gap: 0.75rem;
      }

      .bubble {
        max-width: 90%;
      }

      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 999;
        opacity: 0;
        visibility: hidden;
        transition: all var(--transition-normal);
      }

      .overlay.active {
        opacity: 1;
        visibility: visible;
      }
    }

    /* Loading Animation */
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Welcome Message */
    .welcome-message {
      text-align: center;
      color: var(--text-secondary);
      margin: 2rem 0;
      font-size: 1.1rem;
    }

    .welcome-message h3 {
      color: var(--text-primary);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    /* Scrollbar for Webkit browsers */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-tertiary);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-light);
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay"></div>
  
  <div class="sidebar" id="sidebar">
    <button class="toggle-btn" onclick="toggleSidebar()" aria-label="Toggle sidebar">☰</button>
    <h2>Chat History</h2>
    <div id="vote-stats" class="vote-stats"></div>
    <div id="history" class="history"></div>
    <div class="sidebar-actions">
      <button class="export-button" onclick="exportChatHistory()" title="Download chat history as JSON">
        📥 Export JSON
      </button>
      <button class="clear-history" onclick="clearHistory()">🗑️ Clear History</button>
    </div>
  </div>

  <div class="main">
    <div id="chatbox" class="chatbox">
      <div class="welcome-message">
        <h3>Welcome to Chatbot!</h3>
        <p>Ask me anything and I'll help you find the answers.</p>
      </div>
    </div>
    <form id="chat-form" class="input-area">
      <div class="input-container">
        <input 
          type="text" 
          id="user-input" 
          placeholder="Type your message here..." 
          autocomplete="off"
          maxlength="1000"
        />
      </div>
      <button type="submit" class="send-button" id="send-button">
        <span id="send-text">Send</span>
        <span id="send-loading" class="loading" style="display: none;"></span>
      </button>
    </form>
  </div>

  <script>
    const chatbox = document.getElementById("chatbox");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("user-input");
    const historyEl = document.getElementById("history");
    const sendButton = document.getElementById("send-button");
    const sendText = document.getElementById("send-text");
    const sendLoading = document.getElementById("send-loading");
    const overlay = document.getElementById("overlay");
    
    let isLoading = false;
    
    // Configuration: Set to true if running with server, false for localStorage only
    const USE_SERVER = window.location.protocol !== 'file:' && window.location.hostname !== '';

    // Enhanced form submission with better loading states
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message || isLoading) return;

      setLoading(true);
      appendMessage("user", message);
      input.value = "";
      saveToHistory(message);
      
      const typingId = appendMessage("bot", "", message, true);

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await res.json();
        removeTypingIndicator(typingId);

        data.response.forEach(part => {
          appendMessage("bot", part.content, message, false, part.type);
        });

      } catch (err) {
        removeTypingIndicator(typingId);
        appendMessage("bot", "I'm sorry, something went wrong. Please try again.", message);
      } finally {
        setLoading(false);
      }
    });

    function setLoading(loading) {
      isLoading = loading;
      sendButton.disabled = loading;
      sendText.style.display = loading ? 'none' : 'block';
      sendLoading.style.display = loading ? 'block' : 'none';
    }

    function appendMessage(sender, content, originalQuestion = "", isTyping = false, contentType = "text") {
      const wrapper = document.createElement("div");
      wrapper.classList.add("message", sender);
      wrapper.dataset.typing = isTyping ? "true" : "false";
      
      if (isTyping) {
        wrapper.id = `typing-${Date.now()}`;
      }

      const bubble = document.createElement("div");
      bubble.classList.add("bubble");

      if (isTyping) {
        const typingIndicator = document.createElement("div");
        typingIndicator.classList.add("typing-indicator");
        typingIndicator.innerHTML = `
          AI is typing
          <div class="typing-dots">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        `;
        bubble.appendChild(typingIndicator);
      } else if (contentType === "table" && Array.isArray(content)) {
        const table = document.createElement("table");
        if (content.length > 0) {
          const headers = Object.keys(content[0]);
          const thead = document.createElement("thead");
          const headRow = document.createElement("tr");
          headers.forEach(h => {
            const th = document.createElement("th");
            th.textContent = h;
            headRow.appendChild(th);
          });
          thead.appendChild(headRow);
          table.appendChild(thead);

          const tbody = document.createElement("tbody");
          content.forEach(row => {
            const tr = document.createElement("tr");
            headers.forEach(h => {
              const td = document.createElement("td");
              td.textContent = row[h] || '';
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
          table.appendChild(tbody);
        }
        bubble.appendChild(table);
      } else {
        bubble.innerHTML = content.replace(/\n/g, "<br>");
      }

      wrapper.appendChild(bubble);

      // Add timestamp
      if (!isTyping) {
        const timestamp = document.createElement("div");
        timestamp.classList.add("timestamp");
        timestamp.textContent = new Date().toLocaleTimeString([], { 
          hour: '2-digit', 
          minute: '2-digit' 
        });
        wrapper.appendChild(timestamp);
      }

      // Add voting for bot messages
      if (sender === "bot" && originalQuestion && !isTyping && contentType === "text") {
        const voteContainer = document.createElement("div");
        voteContainer.classList.add("vote-container");

        const upVote = document.createElement("button");
        upVote.className = "vote";
        upVote.innerHTML = "👍";
        upVote.title = "Good response";

        const downVote = document.createElement("button");
        downVote.className = "vote";
        downVote.innerHTML = "👎";
        downVote.title = "Poor response";

        upVote.onclick = async () => {
          upVote.classList.add("selected");
          downVote.classList.remove("selected");
          upVote.disabled = true;
          downVote.disabled = true;
          await vote(originalQuestion, "up");
        };

        downVote.onclick = async () => {
          downVote.classList.add("selected");
          upVote.classList.remove("selected");
          upVote.disabled = true;
          downVote.disabled = true;
          await vote(originalQuestion, "down");
        };

        voteContainer.appendChild(upVote);
        voteContainer.appendChild(downVote);
        wrapper.appendChild(voteContainer);
      }

      chatbox.appendChild(wrapper);
      scrollToBottom();
      
      return isTyping ? wrapper.id : null;
    }

    function removeTypingIndicator(typingId) {
      if (typingId) {
        const typingEl = document.getElementById(typingId);
        if (typingEl) typingEl.remove();
      }
    }

    function scrollToBottom() {
      chatbox.scrollTo({
        top: chatbox.scrollHeight,
        behavior: 'smooth'
      });
    }

    async function vote(question, voteType) {
      try {
        if (USE_SERVER) {
          // Send vote to server
          const response = await fetch("/vote", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question, vote: voteType })
          });
          
          if (response.ok) {
            console.log(`Vote sent to server: ${voteType} for "${question}"`);
          } else {
            throw new Error('Server vote failed');
          }
        } else {
          // Save vote to localStorage
          const votes = JSON.parse(localStorage.getItem("chat_votes") || "{}");
          votes[question] = {
            vote: voteType,
            timestamp: new Date().toISOString()
          };
          localStorage.setItem("chat_votes", JSON.stringify(votes));
          
          // Update chat history with vote
          updateChatHistoryWithVotes();
          
          console.log(`Vote saved locally: ${voteType} for "${question}"`);
        }
        
        // Update vote statistics display
        updateVoteStats();
        
      } catch (err) {
        console.error('Vote failed:', err);
        // Fallback to localStorage if server fails
        if (USE_SERVER) {
          const votes = JSON.parse(localStorage.getItem("chat_votes") || "{}");
          votes[question] = {
            vote: voteType,
            timestamp: new Date().toISOString()
          };
          localStorage.setItem("chat_votes", JSON.stringify(votes));
          updateChatHistoryWithVotes();
          updateVoteStats();
          console.log('Fallback: Vote saved to localStorage');
        }
      }
    }

    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const isMobile = window.innerWidth <= 768;
      
      if (isMobile) {
        sidebar.classList.toggle("open");
        overlay.classList.toggle("active");
      } else {
        sidebar.classList.toggle("collapsed");
      }
    }

    // Close sidebar when clicking overlay on mobile
    overlay.addEventListener('click', () => {
      document.getElementById("sidebar").classList.remove("open");
      overlay.classList.remove("active");
    });

    function saveToHistory(question) {
      const item = document.createElement("div");
      item.className = "history-item";
      item.textContent = question.length > 50 ? question.substring(0, 50) + "..." : question;
      item.title = question;
      item.onclick = () => {
        input.value = question;
        input.focus();
        if (window.innerWidth <= 768) {
          toggleSidebar();
        }
      };
      historyEl.prepend(item);

      const history = JSON.parse(localStorage.getItem("chat_history") || "[]");
      history.unshift(question);
      localStorage.setItem("chat_history", JSON.stringify(history.slice(0, 50)));
      
      // Update vote stats
      updateVoteStats();
    }

    function updateVoteStats() {
      const stats = getVoteStats();
      const voteStatsEl = document.getElementById("vote-stats");
      
      if (stats.total > 0) {
        voteStatsEl.innerHTML = `
          <div class="stats-row">
            <span>👍 Upvotes:</span>
            <span>${stats.upvotes}</span>
          </div>
          <div class="stats-row">
            <span>👎 Downvotes:</span>
            <span>${stats.downvotes}</span>
          </div>
          <div class="stats-row">
            <span><strong>Total Votes:</strong></span>
            <span><strong>${stats.total}</strong></span>
          </div>
        `;
        voteStatsEl.style.display = 'block';
      } else {
        voteStatsEl.innerHTML = `
          <div style="text-align: center; opacity: 0.7;">
            No votes yet
          </div>
        `;
        voteStatsEl.style.display = 'block';
      }
    }

    function clearHistory() {
      if (confirm("Are you sure you want to clear all chat history?")) {
        historyEl.innerHTML = "";
        localStorage.removeItem("chat_history");
        localStorage.removeItem("chat_votes");
        localStorage.removeItem("chat_history_with_votes");
        updateVoteStats();
      }
    }

    function updateChatHistoryWithVotes() {
      // This function updates the internal chat history structure with votes
      // Called after each vote to keep data in sync
      const history = JSON.parse(localStorage.getItem("chat_history") || "[]");
      const votes = JSON.parse(localStorage.getItem("chat_votes") || "{}");
      
      const updatedHistory = history.map(question => ({
        question: question,
        vote: votes[question] ? votes[question].vote : null,
        voteTimestamp: votes[question] ? votes[question].timestamp : null,
        timestamp: new Date().toISOString()
      }));
      
      localStorage.setItem("chat_history_with_votes", JSON.stringify(updatedHistory));
    }

    function exportChatHistory() {
      const history = JSON.parse(localStorage.getItem("chat_history") || "[]");
      const votes = JSON.parse(localStorage.getItem("chat_votes") || "{}");
      
      const exportData = {
        exportDate: new Date().toISOString(),
        totalQuestions: history.length,
        totalVotes: Object.keys(votes).length,
        chatHistory: history.map(question => ({
          question: question,
          vote: votes[question] ? votes[question].vote : null,
          voteTimestamp: votes[question] ? votes[question].timestamp : null
        })),
        votes: votes
      };
      
      const dataStr = JSON.stringify(exportData, null, 2);
      const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
      
      const exportFileDefaultName = `chat_history_${new Date().toISOString().split('T')[0]}.json`;
      
      const linkElement = document.createElement('a');
      linkElement.setAttribute('href', dataUri);
      linkElement.setAttribute('download', exportFileDefaultName);
      linkElement.click();
    }

    function getVoteStats() {
      const votes = JSON.parse(localStorage.getItem("chat_votes") || "{}");
      const upvotes = Object.values(votes).filter(v => v.vote === 'up').length;
      const downvotes = Object.values(votes).filter(v => v.vote === 'down').length;
      
      return { upvotes, downvotes, total: upvotes + downvotes };
    }

    function loadHistory() {
      const history = JSON.parse(localStorage.getItem("chat_history") || "[]");
      history.forEach(q => {
        const item = document.createElement("div");
        item.className = "history-item";
        item.textContent = q.length > 50 ? q.substring(0, 50) + "..." : q;
        item.title = q;
        item.onclick = () => {
          input.value = q;
          input.focus();
          if (window.innerWidth <= 768) {
            toggleSidebar();
          }
        };
        historyEl.appendChild(item);
      });
    }

    // Enhanced keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && window.innerWidth <= 768) {
        const sidebar = document.getElementById("sidebar");
        if (sidebar.classList.contains("open")) {
          toggleSidebar();
        }
      }
      
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        input.focus();
      }
    });

    // Auto-resize input on mobile
    function adjustInputHeight() {
      if (window.innerWidth <= 768) {
        input.style.fontSize = '16px'; // Prevents zoom on iOS
      }
    }

    window.addEventListener('resize', adjustInputHeight);
    
    // Initialize
    loadHistory();
    updateVoteStats();
    adjustInputHeight();
    
    // Focus input on load
    setTimeout(() => {
      input.focus();
    }, 100);
  </script>
</body>
</html>
