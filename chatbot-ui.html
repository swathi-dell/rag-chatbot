<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot UI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
   
    :root {
      --sidebar-width: 280px;
      --primary-color: #3b82f6;
      --primary-dark: #2563eb;
      --primary-light: #dbeafe;
      --secondary-color: #6366f1;
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --bg-tertiary: #f1f5f9;
      --sidebar-bg: linear-gradient(180deg, #1e293b 0%, #334155 100%);
      --text-primary: #1f2937;
      --text-secondary: #6b7280;
      --text-light: #9ca3af;
      --border-color: #e5e7eb;
      --border-light: #f3f4f6;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --transition-normal: 0.3s ease;
    }
 
    * {
      box-sizing: border-box;
    }
 
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-secondary);
      height: 100vh;
      overflow: hidden;
      color: var(--text-primary);
      line-height: 1.6;
    }

    /* App Container */
    .app-container {
      width: 100%;
      height: 100vh;
      display: flex;
      transition: all var(--transition-normal);
    }

    /* Welcome Mode */
    .app-container.welcome-mode {
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #f8fafc 0%, #ffffff 100%);
    }

    .app-container.welcome-mode .sidebar,
    .app-container.welcome-mode .main {
      display: none;
    }

    /* Chat Mode */
    .app-container.chat-mode {
      justify-content: flex-start;
      align-items: stretch;
      background: var(--bg-secondary);
    }

    .app-container.chat-mode .welcome-container {
      display: none;
    }

    /* Welcome Page */
    .welcome-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 600px;
      width: 90%;
      text-align: center;
    }

    .welcome-title {
      font-size: 2.5rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 1rem;
      letter-spacing: -0.025em;
    }

    .welcome-subtitle {
      font-size: 1.2rem;
      color: var(--text-secondary);
      margin-bottom: 2.5rem;
      max-width: 500px;
    }

    .welcome-input-container {
      width: 100%;
      position: relative;
    }

    .welcome-input {
      width: 100%;
      padding: 1.25rem 1.5rem;
      padding-right: 100px;
      font-size: 1.1rem;
      border-radius: 30px;
      border: 2px solid var(--border-color);
      outline: none;
      box-shadow: var(--shadow-lg);
      background: var(--bg-primary);
      font-family: inherit;
      resize: none;
      min-height: 60px;
    }

    .welcome-input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1), var(--shadow-lg);
    }

    .welcome-send-button {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      color: white;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: var(--shadow-md);
    }

    .welcome-send-button:hover {
      transform: translateY(-50%) scale(1.05);
    }

    .welcome-send-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
 
    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      color: white;
      padding: 1.5rem;
      overflow-y: auto;
      flex-shrink: 0;
      box-shadow: var(--shadow-lg);
    }

    .sidebar h2 {
      margin: 0 0 1.5rem 0;
      font-size: 1.1rem;
      font-weight: 600;
      opacity: 0.9;
    }
 
    .history {
      font-size: 0.9rem;
    }
 
    .history-item {
      padding: 0.75rem 0.5rem;
      margin-bottom: 0.5rem;
      border-radius: 8px;
      word-break: break-word;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid transparent;
    }
 
    .history-item:hover {
      background: rgba(255, 255, 255, 0.1);
      border-left-color: var(--primary-color);
    }
 
    .clear-history {
      margin-top: 1rem;
      padding: 0.5rem;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fecaca;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      width: 100%;
    }
 
    .clear-history:hover {
      background: rgba(239, 68, 68, 0.2);
    }
 
    /* Main Chat Area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
    }
 
    .chatbox {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
      background: linear-gradient(135deg, #f8fafc 0%, #ffffff 100%);
    }
 
    /* Messages */
    .message {
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      animation: slideIn 0.3s ease-out;
    }
 
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
 
    .message.user {
      align-items: flex-end;
    }
 
    .bubble {
      background: var(--bg-primary);
      padding: 1.25rem 1.5rem;
      border-radius: 20px;
      max-width: 75%;
      line-height: 1.6;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-light);
      word-wrap: break-word;
    }
 
    .message.user .bubble {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      color: white;
      border: none;
      box-shadow: var(--shadow-lg);
    }
 
    .message.bot .bubble {
      background: var(--bg-primary);
      border-left: 4px solid var(--primary-color);
    }
 
    .timestamp {
      font-size: 0.75rem;
      color: var(--text-light);
      margin-top: 0.5rem;
      opacity: 0.7;
    }
 
    /* Typing Indicator */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-secondary);
      font-style: italic;
    }
 
    .typing-dots {
      display: flex;
      gap: 4px;
    }
 
    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--primary-color);
      border-radius: 50%;
      animation: typingBounce 1.4s infinite;
    }
 
    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }
 
    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }
 
    @keyframes typingBounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }
      30% {
        transform: translateY(-10px);
      }
    }
 
    /* Input Area */
    .input-area {
      display: flex;
      padding: 1.5rem 2rem;
      border-top: 1px solid var(--border-color);
      background: var(--bg-primary);
      box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.05);
      gap: 1rem;
      align-items: flex-end;
    }
 
    .input-container {
      flex: 1;
    }
 
    .chat-input {
      width: 100%;
      padding: 1rem 1.25rem;
      font-size: 1rem;
      border-radius: 25px;
      border: 2px solid var(--border-color);
      outline: none;
      box-shadow: var(--shadow-sm);
      background: var(--bg-secondary);
      font-family: inherit;
    }
 
    .chat-input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      background: var(--bg-primary);
    }
 
    .send-button {
      padding: 1rem 1.5rem;
      border: none;
      border-radius: 25px;
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      color: white;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: var(--shadow-md);
      min-width: 80px;
    }
 
    .send-button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }
 
    .send-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Loading Animation */
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }
 
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Vote Buttons */
    .vote-container {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      align-items: center;
    }
 
    .vote {
      background: var(--bg-secondary);
      font-size: 1.1rem;
      padding: 0.5rem;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
 
    .vote:hover:not(:disabled) {
      background: var(--primary-light);
      border-color: var(--primary-color);
    }
 
    .vote.selected {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }
 
    .vote:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .welcome-title {
        font-size: 2rem;
      }

      .welcome-subtitle {
        font-size: 1rem;
      }

      .chatbox {
        padding: 1rem;
      }

      .input-area {
        padding: 1rem;
      }

      .bubble {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="app-container welcome-mode" id="app-container">
    <!-- Welcome Page -->
    <div class="welcome-container" id="welcome-container">
      <h1 class="welcome-title">What can I help you with today?</h1>
      <p class="welcome-subtitle">Ask me anything and I'll provide helpful answers and assistance.</p>
      
      <div class="welcome-input-container">
        <textarea
          id="welcome-input"
          class="welcome-input"
          placeholder="Type your message here..."
          rows="1"
        ></textarea>
        <button class="welcome-send-button" id="welcome-send-btn">
          <span id="welcome-send-text">Send</span>
          <span id="welcome-loading" class="loading" style="display: none;"></span>
        </button>
      </div>
    </div>

    <!-- Chat Interface -->
    <div class="sidebar" id="sidebar">
      <h2>Chat History</h2>
      <div id="history" class="history"></div>
      <button class="clear-history" onclick="clearHistory()">Clear History</button>
    </div>
 
    <div class="main" id="main">
      <div id="chatbox" class="chatbox"></div>
      <div class="input-area">
        <div class="input-container">
          <input
            type="text"
            id="chat-input"
            class="chat-input"
            placeholder="Type your message here..."
          />
        </div>
        <button class="send-button" id="send-btn">
          <span id="send-text">Send</span>
          <span id="send-loading" class="loading" style="display: none;"></span>
        </button>
      </div>
    </div>
  </div>
 
  <script>
    // DOM Elements
    const appContainer = document.getElementById("app-container");
    const welcomeInput = document.getElementById("welcome-input");
    const welcomeSendBtn = document.getElementById("welcome-send-btn");
    const welcomeSendText = document.getElementById("welcome-send-text");
    const welcomeLoading = document.getElementById("welcome-loading");
    
    const chatbox = document.getElementById("chatbox");
    const chatInput = document.getElementById("chat-input");
    const sendBtn = document.getElementById("send-btn");
    const sendText = document.getElementById("send-text");
    const sendLoading = document.getElementById("send-loading");
    const historyEl = document.getElementById("history");
   
    let isLoading = false;
    let isChatMode = false;

    // Mock responses
    const mockResponses = [
      "Hello! I'm here to help you with any questions you might have. Feel free to ask me anything!",
      "That's an interesting question! Let me think about that for a moment and provide you with a comprehensive answer.",
      "I'd be happy to help you with that. Here's what I think about your query...",
      "Great question! There are several ways to approach this. Let me break it down for you:",
      "Thanks for asking! Based on my understanding, here's what I can tell you about that topic.",
      "I appreciate your question. This is actually a complex topic with several important considerations."
    ];

    // Auto-resize textarea
    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
    }

    // Transition to chat mode
    function transitionToChatMode() {
      console.log("Transitioning to chat mode");
      isChatMode = true;
      appContainer.classList.remove('welcome-mode');
      appContainer.classList.add('chat-mode');
    }

    // Handle message sending
    async function handleMessage(message) {
      console.log("Handling message:", message);
      
      if (!message.trim() || isLoading) {
        console.log("Empty message or loading, returning");
        return;
      }

      setLoading(true);
      
      // Clear inputs
      welcomeInput.value = "";
      chatInput.value = "";

      // Transition to chat mode if needed
      if (!isChatMode) {
        transitionToChatMode();
        // Wait a bit for transition
        await new Promise(resolve => setTimeout(resolve, 100));
      }

      // Add user message
      appendMessage("user", message);
      saveToHistory(message);
     
      // Add typing indicator
      const typingId = appendMessage("bot", "", message, true);

      try {
        // Simulate API delay
        await new Promise(resolve => setTimeout(resolve, 1000 + Math.random() * 2000));
        
        // Remove typing indicator
        removeTypingIndicator(typingId);
        
        // Add bot response
        const randomResponse = mockResponses[Math.floor(Math.random() * mockResponses.length)];
        appendMessage("bot", randomResponse, message);

      } catch (err) {
        console.error("Error:", err);
        removeTypingIndicator(typingId);
        appendMessage("bot", "I'm sorry, something went wrong. Please try again.", message);
      } finally {
        setLoading(false);
      }
    }

    // Set loading state
    function setLoading(loading) {
      isLoading = loading;
      console.log("Setting loading:", loading);
      
      // Welcome button
      welcomeSendBtn.disabled = loading;
      welcomeSendText.style.display = loading ? 'none' : 'block';
      welcomeLoading.style.display = loading ? 'block' : 'none';
      
      // Chat button
      sendBtn.disabled = loading;
      sendText.style.display = loading ? 'none' : 'block';
      sendLoading.style.display = loading ? 'block' : 'none';
    }

    // Add message to chat
    function appendMessage(sender, content, originalQuestion = "", isTyping = false) {
      console.log("Appending message:", sender, content.substring(0, 50) + "...");
      
      const wrapper = document.createElement("div");
      wrapper.classList.add("message", sender);
     
      if (isTyping) {
        wrapper.id = `typing-${Date.now()}`;
      }
 
      const bubble = document.createElement("div");
      bubble.classList.add("bubble");
 
      if (isTyping) {
        const typingIndicator = document.createElement("div");
        typingIndicator.classList.add("typing-indicator");
        typingIndicator.innerHTML = `
          AI is typing
          <div class="typing-dots">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        `;
        bubble.appendChild(typingIndicator);
      } else {
        bubble.textContent = content;
      }
 
      wrapper.appendChild(bubble);
 
      // Add timestamp
      if (!isTyping) {
        const timestamp = document.createElement("div");
        timestamp.classList.add("timestamp");
        timestamp.textContent = new Date().toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit'
        });
        wrapper.appendChild(timestamp);
      }
 
      // Add voting for bot messages
      if (sender === "bot" && originalQuestion && !isTyping) {
        const voteContainer = document.createElement("div");
        voteContainer.classList.add("vote-container");
 
        const upVote = document.createElement("button");
        upVote.className = "vote";
        upVote.innerHTML = "👍";
        upVote.title = "Good response";
 
        const downVote = document.createElement("button");
        downVote.className = "vote";
        downVote.innerHTML = "👎";
        downVote.title = "Poor response";
 
        upVote.onclick = () => {
          upVote.classList.add("selected");
          downVote.classList.remove("selected");
          upVote.disabled = true;
          downVote.disabled = true;
          console.log("Upvoted:", originalQuestion);
        };
 
        downVote.onclick = () => {
          downVote.classList.add("selected");
          upVote.classList.remove("selected");
          upVote.disabled = true;
          downVote.disabled = true;
          console.log("Downvoted:", originalQuestion);
        };
 
        voteContainer.appendChild(upVote);
        voteContainer.appendChild(downVote);
        wrapper.appendChild(voteContainer);
      }
 
      chatbox.appendChild(wrapper);
      scrollToBottom();
     
      return isTyping ? wrapper.id : null;
    }

    // Remove typing indicator
    function removeTypingIndicator(typingId) {
      if (typingId) {
        const typingEl = document.getElementById(typingId);
        if (typingEl) typingEl.remove();
      }
    }

    // Scroll to bottom
    function scrollToBottom() {
      chatbox.scrollTo({
        top: chatbox.scrollHeight,
        behavior: 'smooth'
      });
    }

    // Save to history
    function saveToHistory(question) {
      const item = document.createElement("div");
      item.className = "history-item";
      item.textContent = question.length > 50 ? question.substring(0, 50) + "..." : question;
      item.title = question;
      item.onclick = () => {
        if (isChatMode) {
          chatInput.value = question;
          chatInput.focus();
        } else {
          welcomeInput.value = question;
          welcomeInput.focus();
          autoResize(welcomeInput);
        }
      };
      historyEl.prepend(item);
 
      const history = JSON.parse(localStorage.getItem("chat_history") || "[]");
      history.unshift(question);
      localStorage.setItem("chat_history", JSON.stringify(history.slice(0, 50)));
    }

    // Clear history
    function clearHistory() {
      if (confirm("Are you sure you want to clear all chat history?")) {
        historyEl.innerHTML = "";
        localStorage.removeItem("chat_history");
      }
    }

    // Load history
    function loadHistory() {
      const history = JSON.parse(localStorage.getItem("chat_history") || "[]");
      history.forEach(q => {
        const item = document.createElement("div");
        item.className = "history-item";
        item.textContent = q.length > 50 ? q.substring(0, 50) + "..." : q;
        item.title = q;
        item.onclick = () => {
          if (isChatMode) {
            chatInput.value = q;
            chatInput.focus();
          } else {
            welcomeInput.value = q;
            welcomeInput.focus();
            autoResize(welcomeInput);
          }
        };
        historyEl.appendChild(item);
      });
    }

    // Event Listeners
    welcomeInput.addEventListener('input', () => autoResize(welcomeInput));

    // Welcome send button click
    welcomeSendBtn.addEventListener("click", (e) => {
      e.preventDefault();
      console.log("Welcome send button clicked");
      const message = welcomeInput.value.trim();
      if (message) {
        handleMessage(message);
      }
    });

    // Chat send button click
    sendBtn.addEventListener("click", (e) => {
      e.preventDefault();
      console.log("Chat send button clicked");
      const message = chatInput.value.trim();
      if (message) {
        handleMessage(message);
      }
    });

    // Enter key handling
    welcomeInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        const message = welcomeInput.value.trim();
        if (message) {
          handleMessage(message);
        }
      }
    });

    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        const message = chatInput.value.trim();
        if (message) {
          handleMessage(message);
        }
      }
    });

    // Initialize
    console.log("Initializing...");
    loadHistory();
    
    // Focus welcome input
    setTimeout(() => {
      welcomeInput.focus();
      console.log("Welcome input focused");
    }, 100);
  </script>
</body>
</html>
